<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="code.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator">
        <div class="zeile1">
            <div>Display</div>
        </div>

        <div class="zeile2">
            <button>Clear</button>
            <button>&larr;</button>
            <button>+</button>
        </div>

        <div class="zeile3">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>
        </div>

        <div class="zeile4">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>*</button>
        </div>

        <div class="zeile5">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>/</button>
        </div>

        <div class="zeile6">
            <button>.</button>
            <button>0</button>
            <button>=</button>
        </div>
        
    </div>
</body>
</html>
